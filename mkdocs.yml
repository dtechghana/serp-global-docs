site_name: SchoolERP (sERP) Documentation
site_description: Official documentation for SchoolERP (sERP) — comprehensive school management software for African schools.
site_author: Darrel Technologies Ltd
site_url: https://docs.schoolerpglobal.com

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  logo: assets/serp-logo-white.png

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://schoolerpglobal.com

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
    - Initial Setup: getting-started/index.md
    - User Management: getting-started/user-management.md
  - Modules:
    - Students & Admissions: modules/students.md
    - Academic Management: modules/academic.md
    - Fees & Finance: modules/finance.md
    - HR & Payroll: modules/hr.md
    - Communication & SMS: modules/communication.md
    - Portals & Self-Service: modules/portals.md
  - Country Guides:
    - Overview: country-guides/index.md
    - West Africa:
      - Ghana (GH): country-guides/gh.md
      - Nigeria (NG): country-guides/ng.md
      - Côte d'Ivoire (CI): country-guides/ci.md
      - Senegal (SN): country-guides/sn.md
      - Cameroon (CM): country-guides/cm.md
      - Sierra Leone (SL): country-guides/sl.md
      - Liberia (LR): country-guides/lr.md
      - The Gambia (GM): country-guides/gm.md
      - Benin (BJ): country-guides/bj.md
      - Burkina Faso (BF): country-guides/bf.md
      - Mali (ML): country-guides/ml.md
      - Niger (NE): country-guides/ne.md
      - Togo (TG): country-guides/tg.md
      - Guinea (GN): country-guides/gn.md
    - East Africa:
      - Kenya (KE): country-guides/ke.md
      - Uganda (UG): country-guides/ug.md
      - Tanzania (TZ): country-guides/tz.md
      - Rwanda (RW): country-guides/rw.md
      - Ethiopia (ET): country-guides/et.md
  - Administration:
    - System Settings: administration/settings.md
    - Grading Scales: administration/grading-scales.md
    - Backups & Data Export: administration/backups.md
